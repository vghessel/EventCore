spring:
  application:
    name: eventcore
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: update

jwt:
  key:
    public: classpath:app.pub
    private: classpath:app.key